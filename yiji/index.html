<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>一记 · 极简记账</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title" id="topTitle">一记</div>
      <div class="topbar-sub" id="topSub">今天</div>
    </header>

    <main id="viewHome" class="view"></main>
    <main id="viewFlow" class="view" hidden></main>
    <main id="viewStats" class="view" hidden></main>
    <main id="viewMe" class="view" hidden></main>

    <nav class="tabbar">
      <button class="tab active" data-action="nav-home"><span class="ti">🏠</span><span>记账</span></button>
      <button class="tab" data-action="nav-flow"><span class="ti">📜</span><span>流水</span></button>
      <button class="tab tab-add" data-action="open-rec"><span class="plus">＋</span></button>
      <button class="tab" data-action="nav-stats"><span class="ti">📊</span><span>统计</span></button>
      <button class="tab" data-action="nav-me"><span class="ti">👤</span><span>我的</span></button>
    </nav>
  </div>

  <!-- 录制弹层 -->
  <div id="recModal" class="modal-mask" hidden></div>
  <!-- 通用表单弹层 -->
  <div id="formModal" class="modal-mask" hidden></div>
  <!-- 二级选择器弹层 -->
  <div id="pickerModal" class="modal-mask" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="sync.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
